syntax = "proto3";

package appointments.v1;

import "google/api/annotations.proto";

option go_package = "github.com/dealer/dealer/pkg/pb/appointments/v1;appointmentsv1";

service RepairAppointmentsService {
  rpc ListRepairAppointmentSlots(ListRepairAppointmentSlotsRequest) returns (ListRepairAppointmentSlotsResponse) {
    option (google.api.http) = { get: "/api/repair-appointments/slots" };
  }
  rpc CreateRepairAppointment(CreateRepairAppointmentRequest) returns (CreateRepairAppointmentResponse) {
    option (google.api.http) = { post: "/api/repair-appointments" body: "*" response_body: "appointment" };
  }
  rpc GetRepairAppointment(GetRepairAppointmentRequest) returns (GetRepairAppointmentResponse) {
    option (google.api.http) = { get: "/api/repair-appointments/{id}" response_body: "appointment" };
  }
  rpc UpdateRepairAppointment(UpdateRepairAppointmentRequest) returns (UpdateRepairAppointmentResponse) {
    option (google.api.http) = { put: "/api/repair-appointments/{id}" body: "*" response_body: "appointment" };
  }
  rpc ListRepairAppointments(ListRepairAppointmentsRequest) returns (ListRepairAppointmentsResponse) {
    option (google.api.http) = { get: "/api/repair-appointments" };
  }
  rpc CancelRepairAppointment(CancelRepairAppointmentRequest) returns (CancelRepairAppointmentResponse) {
    option (google.api.http) = { post: "/api/repair-appointments/{id}/cancel" body: "*" response_body: "appointment" };
  }
  rpc CreateWorkOrderFromRepairAppointment(CreateWorkOrderFromRepairAppointmentRequest) returns (CreateWorkOrderFromRepairAppointmentResponse) {
    option (google.api.http) = { post: "/api/repair-appointments/{id}/create-work-order" body: "*" };
  }
}

message RepairAppointmentLabor {
  string id = 1;
  string work_id = 2;
  string description = 3;
  string quantity = 4;
  string unit_price = 5;
  int32 sort_order = 6;
  string work_code = 7;
  string work_name = 8;
}

message RepairAppointmentPart {
  string id = 1;
  string part_id = 2;
  string warehouse_id = 3;
  string quantity = 4;
  string unit_price = 5;
  string notes = 6;
  int32 sort_order = 7;
  string part_name = 8;
  string part_sku = 9;
  string warehouse_name = 10;
}

message RepairAppointment {
  string id = 1;
  string appointment_number = 2;
  string customer_id = 3;
  string customer_name = 4;
  string vehicle_id = 5;
  string vehicle_vin = 6;
  string vehicle_label = 7;
  string dealer_point_id = 8;
  string warehouse_id = 9;
  int64 scheduled_start = 10;
  int64 scheduled_end = 11;
  string status = 12;
  string work_order_id = 13;
  string work_order_number = 14;
  string complaint = 15;
  string notes = 16;
  string created_by = 17;
  int64 created_at = 18;
  int64 updated_at = 19;
  repeated RepairAppointmentLabor labor = 20;
  repeated RepairAppointmentPart parts = 21;
}

message RepairAppointmentLaborInput {
  string work_id = 1;
  string description = 2;
  string quantity = 3;
  string unit_price = 4;
  int32 sort_order = 5;
}

message RepairAppointmentPartInput {
  string part_id = 1;
  string warehouse_id = 2;
  string quantity = 3;
  string unit_price = 4;
  string notes = 5;
  int32 sort_order = 6;
}

message RepairAppointmentSlot {
  int64 start_at = 1;
  int64 end_at = 2;
  bool available = 3;
  string label = 4;
}

message ListRepairAppointmentSlotsRequest {
  string date = 1;
  string dealer_point_id = 2;
}

message ListRepairAppointmentSlotsResponse {
  repeated RepairAppointmentSlot slots = 1;
}

message CreateRepairAppointmentRequest {
  string customer_id = 1;
  string vehicle_id = 2;
  string dealer_point_id = 3;
  string warehouse_id = 4;
  int64 scheduled_start = 5;
  int64 scheduled_end = 6;
  string complaint = 7;
  string notes = 8;
  string created_by = 9;
  repeated RepairAppointmentLaborInput labor = 10;
  repeated RepairAppointmentPartInput parts = 11;
}

message CreateRepairAppointmentResponse {
  RepairAppointment appointment = 1;
}

message GetRepairAppointmentRequest {
  string id = 1;
}

message GetRepairAppointmentResponse {
  RepairAppointment appointment = 1;
}

message UpdateRepairAppointmentRequest {
  string id = 1;
  optional string customer_id = 2;
  optional string vehicle_id = 3;
  optional string dealer_point_id = 4;
  optional string warehouse_id = 5;
  optional int64 scheduled_start = 6;
  optional int64 scheduled_end = 7;
  optional string complaint = 8;
  optional string notes = 9;
  repeated RepairAppointmentLaborInput labor = 10;
  repeated RepairAppointmentPartInput parts = 11;
  bool replace_lines = 12;
}

message UpdateRepairAppointmentResponse {
  RepairAppointment appointment = 1;
}

message ListRepairAppointmentsRequest {
  int32 limit = 1;
  int32 offset = 2;
  string status = 3;
  int64 date_from = 4;
  int64 date_to = 5;
}

message ListRepairAppointmentsResponse {
  repeated RepairAppointment appointments = 1;
  int32 total = 2;
}

message CancelRepairAppointmentRequest {
  string id = 1;
}

message CancelRepairAppointmentResponse {
  RepairAppointment appointment = 1;
}

message CreateWorkOrderFromRepairAppointmentRequest {
  string id = 1;
}

message CreateWorkOrderFromRepairAppointmentResponse {
  string work_order_id = 1;
  string work_order_number = 2;
  RepairAppointment appointment = 3;
}
