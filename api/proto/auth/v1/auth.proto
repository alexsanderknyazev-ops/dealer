syntax = "proto3";

package auth.v1;

import "google/api/annotations.proto";

option go_package = "github.com/dealer/dealer/pkg/pb/auth/v1;authv1";

service AuthService {
  rpc Register(RegisterRequest) returns (RegisterResponse) {
    option (google.api.http) = { post: "/api/register" body: "*" };
  }
  rpc Login(LoginRequest) returns (LoginResponse) {
    option (google.api.http) = { post: "/api/login" body: "*" };
  }
  rpc Refresh(RefreshRequest) returns (RefreshResponse) {
    option (google.api.http) = { post: "/api/refresh" body: "*" };
  }
  rpc Logout(LogoutRequest) returns (LogoutResponse) {
    option (google.api.http) = { post: "/api/logout" body: "*" };
  }
  rpc Validate(ValidateRequest) returns (ValidateResponse) {
    option (google.api.http) = { get: "/api/me" };
  }
}

message RegisterRequest {
  string email = 1;
  string password = 2;
  string name = 3;
  string phone = 4;
}

message RegisterResponse {
  string user_id = 1;
  string email = 2;
  string access_token = 3;
  string refresh_token = 4;
  int64 expires_at = 5;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message LoginResponse {
  string user_id = 1;
  string email = 2;
  string access_token = 3;
  string refresh_token = 4;
  int64 expires_at = 5;
}

message RefreshRequest {
  string refresh_token = 1;
}

message RefreshResponse {
  string access_token = 1;
  string refresh_token = 2;
  int64 expires_at = 3;
}

message LogoutRequest {
  string refresh_token = 1;
}

message LogoutResponse {}

message ValidateRequest {
  string access_token = 1;
}

message ValidateResponse {
  string user_id = 1;
  string email = 2;
  bool valid = 3;
}
