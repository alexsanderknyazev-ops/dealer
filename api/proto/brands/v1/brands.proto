syntax = "proto3";

package brands.v1;

import "google/api/annotations.proto";

option go_package = "github.com/dealer/dealer/pkg/pb/brands/v1;brandsv1";

service BrandsService {
  rpc CreateBrand(CreateBrandRequest) returns (CreateBrandResponse) {
    option (google.api.http) = { post: "/api/brands" body: "*" response_body: "brand" };
  }
  rpc GetBrand(GetBrandRequest) returns (GetBrandResponse) {
    option (google.api.http) = { get: "/api/brands/{id}" response_body: "brand" };
  }
  rpc ListBrands(ListBrandsRequest) returns (ListBrandsResponse) {
    option (google.api.http) = { get: "/api/brands" };
  }
  rpc UpdateBrand(UpdateBrandRequest) returns (UpdateBrandResponse) {
    option (google.api.http) = { put: "/api/brands/{id}" body: "*" response_body: "brand" };
  }
  rpc DeleteBrand(DeleteBrandRequest) returns (DeleteBrandResponse) {
    option (google.api.http) = { delete: "/api/brands/{id}" };
  }

  // Стоимость нормо-часа по бренду и дилерской точке
  rpc ListBrandLaborRates(ListBrandLaborRatesRequest) returns (ListBrandLaborRatesResponse) {
    option (google.api.http) = { get: "/api/brand-labor-rates" };
  }
  rpc UpdateBrandLaborRate(UpdateBrandLaborRateRequest) returns (UpdateBrandLaborRateResponse) {
    option (google.api.http) = { put: "/api/brand-labor-rates" body: "*" response_body: "brand_labor_rate" };
  }
  rpc DeleteBrandLaborRate(DeleteBrandLaborRateRequest) returns (DeleteBrandLaborRateResponse) {
    option (google.api.http) = { delete: "/api/brand-labor-rates/{id}" };
  }
  rpc ResolveBrandLaborRate(ResolveBrandLaborRateRequest) returns (ResolveBrandLaborRateResponse) {
    option (google.api.http) = { get: "/api/brand-labor-rates/resolve" };
  }
}

message Brand {
  string id = 1;
  string name = 2;
  int64 created_at = 3;
  int64 updated_at = 4;
}

message CreateBrandRequest {
  string name = 1;
}

message CreateBrandResponse {
  Brand brand = 1;
}

message GetBrandRequest {
  string id = 1;
}

message GetBrandResponse {
  Brand brand = 1;
}

message ListBrandsRequest {
  int32 limit = 1;
  int32 offset = 2;
  string search = 3;
}

message ListBrandsResponse {
  repeated Brand brands = 1;
  int32 total = 2;
}

message UpdateBrandRequest {
  string id = 1;
  optional string name = 2;
}

message UpdateBrandResponse {
  Brand brand = 1;
}

message DeleteBrandRequest {
  string id = 1;
}

message DeleteBrandResponse {}

message BrandLaborRate {
  string id = 1;
  string brand_id = 2;
  string dealer_point_id = 3;
  string warranty_hour_price = 4;
  string commercial_hour_price = 5;
  int64 created_at = 6;
  int64 updated_at = 7;
}

message ListBrandLaborRatesRequest {
  int32 limit = 1;
  int32 offset = 2;
  string brand_id = 3;
  string dealer_point_id = 4;
}

message ListBrandLaborRatesResponse {
  repeated BrandLaborRate brand_labor_rates = 1;
  int32 total = 2;
}

message UpdateBrandLaborRateRequest {
  string brand_id = 1;
  string dealer_point_id = 2;
  string warranty_hour_price = 3;
  string commercial_hour_price = 4;
}

message UpdateBrandLaborRateResponse {
  BrandLaborRate brand_labor_rate = 1;
}

message DeleteBrandLaborRateRequest {
  string id = 1;
}

message DeleteBrandLaborRateResponse {}

message ResolveBrandLaborRateRequest {
  string brand_id = 1;
  string dealer_point_id = 2;
  string repair_type = 3;
}

message ResolveBrandLaborRateResponse {
  string warranty_hour_price = 1;
  string commercial_hour_price = 2;
  string hour_price = 3;
  bool found = 4;
}
