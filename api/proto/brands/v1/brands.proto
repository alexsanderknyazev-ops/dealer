syntax = "proto3";

package brands.v1;

import "google/api/annotations.proto";

option go_package = "github.com/dealer/dealer/pkg/pb/brands/v1;brandsv1";

service BrandsService {
  rpc CreateBrand(CreateBrandRequest) returns (CreateBrandResponse) {
    option (google.api.http) = { post: "/api/brands" body: "*" response_body: "brand" };
  }
  rpc GetBrand(GetBrandRequest) returns (GetBrandResponse) {
    option (google.api.http) = { get: "/api/brands/{id}" response_body: "brand" };
  }
  rpc ListBrands(ListBrandsRequest) returns (ListBrandsResponse) {
    option (google.api.http) = { get: "/api/brands" };
  }
  rpc UpdateBrand(UpdateBrandRequest) returns (UpdateBrandResponse) {
    option (google.api.http) = { put: "/api/brands/{id}" body: "*" response_body: "brand" };
  }
  rpc DeleteBrand(DeleteBrandRequest) returns (DeleteBrandResponse) {
    option (google.api.http) = { delete: "/api/brands/{id}" };
  }
}

message Brand {
  string id = 1;
  string name = 2;
  int64 created_at = 3;
  int64 updated_at = 4;
}

message CreateBrandRequest {
  string name = 1;
}

message CreateBrandResponse {
  Brand brand = 1;
}

message GetBrandRequest {
  string id = 1;
}

message GetBrandResponse {
  Brand brand = 1;
}

message ListBrandsRequest {
  int32 limit = 1;
  int32 offset = 2;
  string search = 3;
}

message ListBrandsResponse {
  repeated Brand brands = 1;
  int32 total = 2;
}

message UpdateBrandRequest {
  string id = 1;
  optional string name = 2;
}

message UpdateBrandResponse {
  Brand brand = 1;
}

message DeleteBrandRequest {
  string id = 1;
}

message DeleteBrandResponse {}
