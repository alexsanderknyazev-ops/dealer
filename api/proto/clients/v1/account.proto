syntax = "proto3";

package clients.v1;

import "google/api/annotations.proto";
import "clients/v1/common.proto";

option go_package = "github.com/dealer/dealer/pkg/pb/clients/v1;clientsv1";

// Личный кабинет клиента (client-protected-gateway).
service ClientAccountService {
  rpc AddVehicle(AddVehicleRequest) returns (AddVehicleResponse) {
    option (google.api.http) = { post: "/api/client/vehicles" body: "*" response_body: "vehicle" };
  }
  rpc ListMyVehicles(ListMyVehiclesRequest) returns (ListMyVehiclesResponse) {
    option (google.api.http) = { get: "/api/client/vehicles" };
  }
  rpc GetProfile(GetProfileRequest) returns (GetProfileResponse) {
    option (google.api.http) = { get: "/api/client/profile" response_body: "profile" };
  }
  rpc ListClientNotifications(ListClientNotificationsRequest) returns (ListClientNotificationsResponse) {
    option (google.api.http) = { get: "/api/client/notifications" };
  }
  rpc DismissClientNotification(DismissClientNotificationRequest) returns (DismissClientNotificationResponse) {
    option (google.api.http) = { post: "/api/client/notifications/{id}/dismiss" body: "*" };
  }
}

message AddVehicleRequest {
  string vin = 1;
}

message AddVehicleResponse {
  ClientVehicle vehicle = 1;
}

message ListMyVehiclesRequest {}

message ListMyVehiclesResponse {
  repeated ClientVehicle vehicles = 1;
}

message GetProfileRequest {}

message GetProfileResponse {
  ClientProfile profile = 1;
}

message ClientNotification {
  string id = 1;
  string kind = 2;
  string source_type = 3;
  string source_id = 4;
  string title = 5;
  string body = 6;
  string status = 7;
  int64 created_at = 8;
}

message ListClientNotificationsRequest {}

message ListClientNotificationsResponse {
  repeated ClientNotification notifications = 1;
}

message DismissClientNotificationRequest {
  string id = 1;
}

message DismissClientNotificationResponse {}
