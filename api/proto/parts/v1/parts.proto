syntax = "proto3";

package parts.v1;

import "google/api/annotations.proto";

option go_package = "github.com/dealer/dealer/pkg/pb/parts/v1;partsv1";

service PartsService {
  rpc CreatePart(CreatePartRequest) returns (CreatePartResponse) {
    option (google.api.http) = { post: "/api/parts" body: "*" response_body: "part" };
  }
  rpc GetPart(GetPartRequest) returns (GetPartResponse) {
    option (google.api.http) = { get: "/api/parts/{id}" response_body: "part" };
  }
  rpc ListPartStock(ListPartStockRequest) returns (ListPartStockResponse) {
    option (google.api.http) = { get: "/api/parts/{part_id}/stock" };
  }
  rpc ListParts(ListPartsRequest) returns (ListPartsResponse) {
    option (google.api.http) = { get: "/api/parts" };
  }
  rpc UpdatePart(UpdatePartRequest) returns (UpdatePartResponse) {
    option (google.api.http) = { put: "/api/parts/{id}" body: "*" response_body: "part" };
  }
  rpc DeletePart(DeletePartRequest) returns (DeletePartResponse) {
    option (google.api.http) = { delete: "/api/parts/{id}" };
  }

  rpc CreateFolder(CreateFolderRequest) returns (CreateFolderResponse) {
    option (google.api.http) = { post: "/api/parts/folders" body: "*" response_body: "folder" };
  }
  rpc GetFolder(GetFolderRequest) returns (GetFolderResponse) {
    option (google.api.http) = { get: "/api/parts/folders/{id}" response_body: "folder" };
  }
  rpc ListFolders(ListFoldersRequest) returns (ListFoldersResponse) {
    option (google.api.http) = { get: "/api/parts/folders" };
  }
  rpc UpdateFolder(UpdateFolderRequest) returns (UpdateFolderResponse) {
    option (google.api.http) = { put: "/api/parts/folders/{id}" body: "*" response_body: "folder" };
  }
  rpc DeleteFolder(DeleteFolderRequest) returns (DeleteFolderResponse) {
    option (google.api.http) = { delete: "/api/parts/folders/{id}" };
  }

  rpc CreateMovementDocument(CreateMovementDocumentRequest) returns (CreateMovementDocumentResponse) {
    option (google.api.http) = { post: "/api/movement-documents" body: "*" response_body: "document" };
  }
  rpc GetMovementDocument(GetMovementDocumentRequest) returns (GetMovementDocumentResponse) {
    option (google.api.http) = { get: "/api/movement-documents/{id}" response_body: "document" };
  }
  rpc UpdateMovementDocument(UpdateMovementDocumentRequest) returns (UpdateMovementDocumentResponse) {
    option (google.api.http) = { put: "/api/movement-documents/{id}" body: "*" response_body: "document" };
  }
  rpc ListMovementDocuments(ListMovementDocumentsRequest) returns (ListMovementDocumentsResponse) {
    option (google.api.http) = { get: "/api/movement-documents" };
  }
  rpc StartMovementDocument(StartMovementDocumentRequest) returns (StartMovementDocumentResponse) {
    option (google.api.http) = { post: "/api/movement-documents/{id}/start" body: "*" response_body: "document" };
  }
  rpc CloseMovementDocument(CloseMovementDocumentRequest) returns (CloseMovementDocumentResponse) {
    option (google.api.http) = { post: "/api/movement-documents/{id}/close" body: "*" response_body: "document" };
  }
  // Устаревший alias: закрывает документ (списание со склада).
  rpc ConfirmMovementDocument(ConfirmMovementDocumentRequest) returns (ConfirmMovementDocumentResponse) {
    option (google.api.http) = { post: "/api/movement-documents/{id}/confirm" body: "*" response_body: "document" };
  }
  rpc CancelMovementDocument(CancelMovementDocumentRequest) returns (CancelMovementDocumentResponse) {
    option (google.api.http) = { post: "/api/movement-documents/{id}/cancel" body: "*" response_body: "document" };
  }
  rpc CreateProductionExtraction(CreateProductionExtractionRequest) returns (CreateProductionExtractionResponse) {
    option (google.api.http) = { post: "/api/movement-documents/{id}/create-production-extraction" body: "*" response_body: "document" };
  }
}

message PartFolder {
  string id = 1;
  string name = 2;
  string parent_id = 3;   // empty = root
  int64 created_at = 4;
  int64 updated_at = 5;
}

message CreateFolderRequest {
  string name = 1;
  string parent_id = 2;   // optional, empty = root
}

message CreateFolderResponse {
  PartFolder folder = 1;
}

message GetFolderRequest {
  string id = 1;
}

message GetFolderResponse {
  PartFolder folder = 1;
}

message ListFoldersRequest {
  string parent_id = 1;  // empty = root folders
}

message ListFoldersResponse {
  repeated PartFolder folders = 1;
}

message UpdateFolderRequest {
  string id = 1;
  optional string name = 2;
  optional string parent_id = 3;
}

message UpdateFolderResponse {
  PartFolder folder = 1;
}

message DeleteFolderRequest {
  string id = 1;
}

message DeleteFolderResponse {}

message StockMovement {
  string id = 1;
  string part_id = 2;
  string warehouse_id = 3;
  int32 quantity = 4;
  string movement_type = 5;
  string reference_type = 6;
  string reference_id = 7;
  string reference_line_id = 8;
  string notes = 9;
  string created_by = 10;
  int64 created_at = 11;
  string movement_document_id = 12;
}

message MovementDocumentLine {
  string id = 1;
  string part_id = 2;
  string warehouse_id = 3;
  int32 quantity = 4;
  string reference_line_id = 5;
  string notes = 6;
  int32 sort_order = 7;
  string part_name = 8;
  string part_sku = 9;
  string warehouse_name = 10;
  string destination_warehouse_id = 11;
  string destination_warehouse_name = 12;
  int32 source_stock_quantity = 13;
}

message MovementDocumentLineInput {
  string part_id = 1;
  string warehouse_id = 2;
  int32 quantity = 3;
  string reference_line_id = 4;
  string notes = 5;
  int32 sort_order = 6;
  string destination_warehouse_id = 7;
}

message MovementDocument {
  string id = 1;
  string document_number = 2;
  string status = 3;
  string movement_type = 4;
  string reference_type = 5;
  string reference_id = 6;
  string notes = 7;
  string created_by = 8;
  string confirmed_by = 9;
  int64 created_at = 10;
  int64 confirmed_at = 11;
  int64 updated_at = 12;
  repeated MovementDocumentLine lines = 13;
  string created_by_name = 14;
  string confirmed_by_name = 15;
  string reference_label = 16;
  string customer_name = 17;
  string vehicle_vin = 18;
  string vehicle_label = 19;
  string parent_document_id = 20;
  string parent_document_number = 21;
}

message UpdateMovementDocumentRequest {
  string id = 1;
  optional string movement_type = 2;
  optional string notes = 3;
  repeated MovementDocumentLineInput lines = 4;
  bool replace_lines = 5;
}

message UpdateMovementDocumentResponse {
  MovementDocument document = 1;
}

message CreateMovementDocumentRequest {
  string movement_type = 1;
  string reference_type = 2;
  string reference_id = 3;
  string notes = 4;
  string created_by = 5;
  repeated MovementDocumentLineInput lines = 6;
}

message CreateMovementDocumentResponse {
  MovementDocument document = 1;
}

message GetMovementDocumentRequest {
  string id = 1;
}

message GetMovementDocumentResponse {
  MovementDocument document = 1;
}

message ListMovementDocumentsRequest {
  int32 limit = 1;
  int32 offset = 2;
  string status = 3;
  string reference_type = 4;
  string reference_id = 5;
}

message ListMovementDocumentsResponse {
  repeated MovementDocument documents = 1;
  int32 total = 2;
}

message StartMovementDocumentRequest {
  string id = 1;
}

message StartMovementDocumentResponse {
  MovementDocument document = 1;
}

message CloseMovementDocumentRequest {
  string id = 1;
  string closed_by = 2;
}

message CloseMovementDocumentResponse {
  MovementDocument document = 1;
}

message ConfirmMovementDocumentRequest {
  string id = 1;
  string confirmed_by = 2;
}

message ConfirmMovementDocumentResponse {
  MovementDocument document = 1;
}

message CancelMovementDocumentRequest {
  string id = 1;
  string cancelled_by = 2;
}

message CancelMovementDocumentResponse {
  MovementDocument document = 1;
}

message CreateProductionExtractionRequest {
  string id = 1;
  string created_by = 2;
}

message CreateProductionExtractionResponse {
  MovementDocument document = 1;
}

message Part {
  string id = 1;
  string sku = 2;           // артикул
  string name = 3;
  string category = 4;      // Фильтры, Тормоза, и т.д. (для обратной совместимости)
  string folder_id = 5;     // папка
  int32 quantity = 6;
  string unit = 7;         // шт, комплект, л, кг
  string price = 8;        // decimal as string
  string location = 9;      // склад/полка
  string notes = 10;
  string brand_id = 13;     // optional, UUID of brand
  string dealer_point_id = 14;
  string legal_entity_id = 15;
  string warehouse_id = 16;
  int64 created_at = 11;
  int64 updated_at = 12;
}

message CreatePartRequest {
  string sku = 1;
  string name = 2;
  string category = 3;
  string folder_id = 4;
  int32 quantity = 5;
  string unit = 6;
  string price = 7;
  string location = 8;
  string notes = 9;
  string brand_id = 10;   // optional
  string dealer_point_id = 11;
  string legal_entity_id = 12;
  string warehouse_id = 13;
}

message CreatePartResponse {
  Part part = 1;
}

message GetPartRequest {
  string id = 1;
}

message PartStockRow {
  string warehouse_id = 1;
  int32 quantity = 2;
}

message ListPartStockRequest {
  string part_id = 1;
}

message ListPartStockResponse {
  repeated PartStockRow stock = 1;
}

message GetPartResponse {
  Part part = 1;
}

message ListPartsRequest {
  int32 limit = 1;
  int32 offset = 2;
  string search = 3;    // sku, name
  string category = 4;  // filter by category
  string folder_id = 5; // filter by folder (empty = any)
  string brand_id = 6;  // filter by brand
  string dealer_point_id = 7;
  string legal_entity_id = 8;
  string warehouse_id = 9;
}

message ListPartsResponse {
  repeated Part parts = 1;
  int32 total = 2;
}

message UpdatePartRequest {
  string id = 1;
  optional string sku = 2;
  optional string name = 3;
  optional string category = 4;
  optional string folder_id = 5;
  optional int32 quantity = 6;
  optional string unit = 7;
  optional string price = 8;
  optional string location = 9;
  optional string notes = 10;
  optional string brand_id = 11;
  optional string dealer_point_id = 12;
  optional string legal_entity_id = 13;
  optional string warehouse_id = 14;
}

message UpdatePartResponse {
  Part part = 1;
}

message DeletePartRequest {
  string id = 1;
}

message DeletePartResponse {}
