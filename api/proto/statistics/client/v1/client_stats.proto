syntax = "proto3";

package statistics.client.v1;

import "google/api/annotations.proto";

option go_package = "github.com/dealer/dealer/pkg/pb/statistics/client/v1;clientstatsv1";

// Сводная статистика по клиентской зоне (employee gateway).
service ClientStatisticsService {
  rpc GetOverview(GetOverviewRequest) returns (GetOverviewResponse) {
    option (google.api.http) = { get: "/api/stats/client/overview" response_body: "overview" };
  }
}

message ReviewStatusCount {
  string status = 1;
  int64 count = 2;
}

message ClientOverview {
  int64 clients_count = 1;
  int64 client_vehicles_count = 2;
  int64 registered_users_count = 3;
  int64 reviews_count = 4;
  double average_rating = 5;
  repeated ReviewStatusCount reviews_by_status = 6;
}

message GetOverviewRequest {}

message GetOverviewResponse {
  ClientOverview overview = 1;
}
