server {
    listen 3001;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/login {
        proxy_pass http://client-public-gateway-service.dealer.svc.cluster.local:8091;
        proxy_set_header Host $host;
    }
    location /api/refresh {
        proxy_pass http://client-public-gateway-service.dealer.svc.cluster.local:8091;
        proxy_set_header Host $host;
    }
    location /api/logout {
        proxy_pass http://client-public-gateway-service.dealer.svc.cluster.local:8091;
        proxy_set_header Host $host;
    }
    location /api/client/register {
        proxy_pass http://client-public-gateway-service.dealer.svc.cluster.local:8091;
        proxy_set_header Host $host;
    }
    location /api/ {
        proxy_pass http://client-protected-gateway-service.dealer.svc.cluster.local:8093;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
