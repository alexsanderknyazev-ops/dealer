services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dealer
      # Set POSTGRES_PASSWORD in .env (see .env.example). Do not commit real secrets.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: dealer
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dealer -d dealer"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://127.0.0.1:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8123/ping | grep -q Ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  errors-ingest-service:
    build:
      context: .
      dockerfile: build/errors-ingest-service.Dockerfile
    ports:
      - "8092:8092"
    environment:
      ERRORS_INGEST_HTTP_PORT: "8092"
      KAFKA_BROKERS: "kafka:29092"
      KAFKA_TOPIC_ERRORS: "platform.errors.v1"
      KAFKA_CONSUMER_GROUP: "errors-ingest"
      CLICKHOUSE_ADDR: "clickhouse:9000"
      CLICKHOUSE_DATABASE: "analytics"
      CLICKHOUSE_USER: "default"
      CLICKHOUSE_PASSWORD: ""
      ENVIRONMENT: "development"
    depends_on:
      kafka:
        condition: service_started
      clickhouse:
        condition: service_healthy

  gateway-service:
    build:
      context: .
      dockerfile: build/gateway-service.Dockerfile
    ports:
      - "8090:8090"
    environment:
      GATEWAY_HTTP_PORT: "8090"
      KAFKA_BROKERS: "kafka:29092"
      KAFKA_TOPIC_ERRORS: "platform.errors.v1"
      AUTH_GRPC_ADDR: "auth-service:50051"
      CUSTOMERS_GRPC_ADDR: "customers-service:50052"
      VEHICLES_GRPC_ADDR: "vehicles-service:50053"
      DEALS_GRPC_ADDR: "deals-service:50054"
      PARTS_GRPC_ADDR: "parts-service:50055"
      BRANDS_GRPC_ADDR: "brands-service:50056"
      DEALER_POINTS_GRPC_ADDR: "dealer-points-service:50057"
    depends_on:
      auth-service:
        condition: service_started
      dealer-points-service:
        condition: service_started
      brands-service:
        condition: service_started
      customers-service:
        condition: service_started
      vehicles-service:
        condition: service_started
      deals-service:
        condition: service_started
      parts-service:
        condition: service_started
      kafka:
        condition: service_started

  auth-service:
    build:
      context: .
      dockerfile: build/auth-service.Dockerfile
    ports:
      - "50051:50051"
      - "8080:8080"
    environment:
      AUTH_GRPC_PORT: "50051"
      AUTH_HTTP_PORT: "8080"
      STATIC_DIR: "/app/web"
      POSTGRES_DSN: postgres://dealer:${POSTGRES_PASSWORD:-changeme}@postgres:5432/dealer?sslmode=disable
      REDIS_ADDR: "redis:6379"
      REDIS_PASSWORD: ""
      REDIS_DB: "0"
      KAFKA_BROKERS: "kafka:29092"
      KAFKA_TOPIC_AUTH_EVENTS: "auth.events"
      KAFKA_TOPIC_ERRORS: "platform.errors.v1"
      ERRORS_INGEST_SERVICE_URL: "http://errors-ingest-service:8092"
      JWT_SECRET: "change-me-in-production"
      GATEWAY_SERVICE_URL: "http://gateway-service:8090"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started

  customers-service:
    build:
      context: .
      dockerfile: build/customers-service.Dockerfile
    ports:
      - "50052:50052"
    environment:
      CUSTOMERS_GRPC_PORT: "50052"
      CUSTOMERS_HTTP_PORT: "8081"
      POSTGRES_DSN: postgres://dealer:${POSTGRES_PASSWORD:-changeme}@postgres:5432/dealer?sslmode=disable
      JWT_SECRET: "change-me-in-production"
      KAFKA_BROKERS: "kafka:29092"
      KAFKA_TOPIC_ERRORS: "platform.errors.v1"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  vehicles-service:
    build:
      context: .
      dockerfile: build/vehicles-service.Dockerfile
    ports:
      - "50053:50053"
    environment:
      VEHICLES_GRPC_PORT: "50053"
      VEHICLES_HTTP_PORT: "8082"
      POSTGRES_DSN: postgres://dealer:${POSTGRES_PASSWORD:-changeme}@postgres:5432/dealer?sslmode=disable
      JWT_SECRET: "change-me-in-production"
      BRANDS_GRPC_ADDR: "brands-service:50056"
      DEALER_POINTS_GRPC_ADDR: "dealer-points-service:50057"
      KAFKA_BROKERS: "kafka:29092"
      KAFKA_TOPIC_ERRORS: "platform.errors.v1"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      brands-service:
        condition: service_started
      dealer-points-service:
        condition: service_started

  deals-service:
    build:
      context: .
      dockerfile: build/deals-service.Dockerfile
    ports:
      - "50054:50054"
    environment:
      DEALS_GRPC_PORT: "50054"
      DEALS_HTTP_PORT: "8083"
      POSTGRES_DSN: postgres://dealer:${POSTGRES_PASSWORD:-changeme}@postgres:5432/dealer?sslmode=disable
      JWT_SECRET: "change-me-in-production"
      CUSTOMERS_GRPC_ADDR: "customers-service:50052"
      VEHICLES_GRPC_ADDR: "vehicles-service:50053"
      KAFKA_BROKERS: "kafka:29092"
      KAFKA_TOPIC_ERRORS: "platform.errors.v1"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      customers-service:
        condition: service_started
      vehicles-service:
        condition: service_started

  parts-service:
    build:
      context: .
      dockerfile: build/parts-service.Dockerfile
    ports:
      - "50055:50055"
    environment:
      PARTS_GRPC_PORT: "50055"
      PARTS_HTTP_PORT: "8084"
      POSTGRES_DSN: postgres://dealer:${POSTGRES_PASSWORD:-changeme}@postgres:5432/dealer?sslmode=disable
      JWT_SECRET: "change-me-in-production"
      BRANDS_GRPC_ADDR: "brands-service:50056"
      DEALER_POINTS_GRPC_ADDR: "dealer-points-service:50057"
      KAFKA_BROKERS: "kafka:29092"
      KAFKA_TOPIC_ERRORS: "platform.errors.v1"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      brands-service:
        condition: service_started
      dealer-points-service:
        condition: service_started

  brands-service:
    build:
      context: .
      dockerfile: build/brands-service.Dockerfile
    ports:
      - "50056:50056"
    environment:
      BRANDS_GRPC_PORT: "50056"
      BRANDS_HTTP_PORT: "8085"
      POSTGRES_DSN: postgres://dealer:${POSTGRES_PASSWORD:-changeme}@postgres:5432/dealer?sslmode=disable
      JWT_SECRET: "change-me-in-production"
      KAFKA_BROKERS: "kafka:29092"
      KAFKA_TOPIC_ERRORS: "platform.errors.v1"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  dealer-points-service:
    build:
      context: .
      dockerfile: build/dealer-points-service.Dockerfile
    ports:
      - "50057:50057"
    environment:
      DEALER_POINTS_GRPC_PORT: "50057"
      DEALER_POINTS_HTTP_PORT: "8086"
      POSTGRES_DSN: postgres://dealer:${POSTGRES_PASSWORD:-changeme}@postgres:5432/dealer?sslmode=disable
      JWT_SECRET: "change-me-in-production"
      KAFKA_BROKERS: "kafka:29092"
      KAFKA_TOPIC_ERRORS: "platform.errors.v1"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

volumes:
  postgres_data: {}
  clickhouse_data: {}
