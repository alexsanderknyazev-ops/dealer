      CLIENT_REGISTRATION_GRPC_ADDR: "client-registration-service:50058"
      CLIENT_REVIEWS_GRPC_ADDR: "client-reviews-service:50060"
      KAFKA_BROKERS: "kafka:29092"
      KAFKA_TOPIC_ERRORS: "platform.errors.v1"
    depends_on:
      client-auth-service:
        condition: service_started
      client-registration-service:
        condition: service_started
      client-reviews-service:
        condition: service_started
      kafka:
        condition: service_started

  client-reviews-service:
