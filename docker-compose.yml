x-tracing: &tracing
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4318"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dealer
      # Set POSTGRES_PASSWORD in .env (see .env.example). Do not commit real secrets.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: dealer
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dealer -d dealer"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://127.0.0.1:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # localhost → [::1] on Alpine; IPv6 is disabled in Docker Desktop — use 127.0.0.1
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8123/ping | grep -q Ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  errors-ingest-service:
    build:
      context: .
      dockerfile: build/errors-ingest-service.Dockerfile
    ports:
      - "8092:8092"
    environment:
      <<: *tracing
      ERRORS_INGEST_HTTP_PORT: "8092"
      KAFKA_BROKERS: "kafka:29092"
      KAFKA_TOPIC_ERRORS: "platform.errors.v1"
      KAFKA_CONSUMER_GROUP: "errors-ingest"
      CLICKHOUSE_ADDR: "clickhouse:9000"
      CLICKHOUSE_DATABASE: "analytics"
      CLICKHOUSE_USER: "default"
      CLICKHOUSE_PASSWORD: ""
      ENVIRONMENT: "development"
    depends_on:
      kafka:
        condition: service_started
      clickhouse:
        condition: service_healthy

  client-public-gateway-service:
    build:
      context: .
      dockerfile: build/client-public-gateway-service.Dockerfile
    ports:
      - "8091:8091"
    environment:
      <<: *tracing
      CLIENT_PUBLIC_GATEWAY_HTTP_PORT: "8091"
      CLIENT_AUTH_GRPC_ADDR: "client-auth-service:50059"
      CLIENT_REGISTRATION_GRPC_ADDR: "client-registration-service:50058"
      KAFKA_BROKERS: "kafka:29092"
      KAFKA_TOPIC_ERRORS: "platform.errors.v1"
    depends_on:
      client-auth-service:
        condition: service_started
      client-registration-service:
        condition: service_started
      kafka:
        condition: service_started

  client-protected-gateway-service:
    build:
      context: .
      dockerfile: build/client-protected-gateway-service.Dockerfile
    ports:
      - "8093:8093"
    environment:
      <<: *tracing
