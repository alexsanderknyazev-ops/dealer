apiVersion: v1
kind: Service
metadata:
  name: client-frontend
  namespace: dealer
spec:
  selector:
    app: client-frontend
  ports:
    - name: http
      port: 3001
      targetPort: 3001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: client-frontend
  namespace: dealer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: client-frontend
  template:
    metadata:
      labels:
        app: client-frontend
    spec:
      containers:
        - name: client-frontend
          image: dealer-client-ui:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3001
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          env:
            - name: VITE_CLIENT_PUBLIC_GATEWAY
              value: "http://client-public-gateway-service:8091"
            - name: VITE_CLIENT_PROTECTED_GATEWAY
              value: "http://client-protected-gateway-service:8093"
