apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: client-http
  namespace: dealer
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "32m"
spec:
  ingressClassName: nginx
  rules:
    - host: client.dealer.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: client-public-gateway-service
                port:
                  number: 8091
