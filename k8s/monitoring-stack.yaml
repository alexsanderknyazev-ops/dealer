# Prometheus + Grafana для стека dealer (namespace monitoring).
# Scrape: GET /metrics на HTTP-портах микросервисов (pkg/metrics, METRICS_ENABLED=true по умолчанию).
---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    scrape_configs:
      - job_name: dealer-services
        metrics_path: /metrics
        static_configs:
          - targets:
              - auth-service.dealer.svc.cluster.local:8080
              - customers-service.dealer.svc.cluster.local:8081
              - vehicles-service.dealer.svc.cluster.local:8082
              - deals-service.dealer.svc.cluster.local:8083
              - parts-service.dealer.svc.cluster.local:8084
              - brands-service.dealer.svc.cluster.local:8085
              - dealer-points-service.dealer.svc.cluster.local:8086
              - client-registration-service.dealer.svc.cluster.local:8087
              - client-auth-service.dealer.svc.cluster.local:8088
              - client-reviews-service.dealer.svc.cluster.local:8089
              - gateway-service.dealer.svc.cluster.local:8090
              - client-public-gateway-service.dealer.svc.cluster.local:8091
              - client-protected-gateway-service.dealer.svc.cluster.local:8093
              - employee-statistics-service.dealer.svc.cluster.local:8094
              - client-statistics-service.dealer.svc.cluster.local:8095
              - employee-reviews-service.dealer.svc.cluster.local:8096
              - workorders-service.dealer.svc.cluster.local:8097
              - works-service.dealer.svc.cluster.local:8098
              - employees-service.dealer.svc.cluster.local:8099
              - appointments-service.dealer.svc.cluster.local:8101
            labels:
              cluster: dealer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.55.1
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --web.enable-lifecycle
          ports:
            - containerPort: 9090
              name: http
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app: prometheus
spec:
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: 9090
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: monitoring
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.monitoring.svc.cluster.local:9090
        isDefault: true
        editable: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: monitoring
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: dealer-dashboards
        orgId: 1
        folder: Dealer
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards
# ConfigMap grafana-dashboards создаётся scripts/apply-grafana-dashboards.sh (не kubectl apply monitoring-stack.yaml)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: admin
            - name: GF_USERS_DEFAULT_THEME
              value: dark
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: dashboards
          configMap:
            name: grafana-dashboards
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app: grafana
spec:
  selector:
    app: grafana
  ports:
    - name: http
      port: 3000
      targetPort: 3000
