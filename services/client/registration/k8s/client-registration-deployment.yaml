apiVersion: apps/v1
kind: Deployment
metadata:
  name: client-registration-service
  namespace: dealer
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      app: client-registration-service
  template:
    metadata:
      labels:
        app: client-registration-service
    spec:
      containers:
        - name: client-registration-service
          image: __IMG_CLIENT_REGISTRATION__
          imagePullPolicy: __PULL_POLICY__
          ports:
            - containerPort: 50058
            - containerPort: 8087
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8087
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8087
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          env:
            - name: CLIENT_REGISTRATION_GRPC_PORT
              value: "50058"
            - name: CLIENT_REGISTRATION_HTTP_PORT
              value: "8087"
            - name: POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: dealer-db
                  key: POSTGRES_DSN
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: dealer-app-secrets
                  key: JWT_SECRET
            - name: CLIENT_AUTH_GRPC_ADDR
              value: "client-auth-service:50059"
            - name: VEHICLES_GRPC_ADDR
              value: "vehicles-service:50053"
            - name: KAFKA_BROKERS
              value: "kafka:29092"
            - name: KAFKA_TOPIC_CLIENT_REGISTRATION
              value: "client.registration.v1"
            - name: KAFKA_TOPIC_ERRORS
              value: "platform.errors.v1"
