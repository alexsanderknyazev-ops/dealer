apiVersion: apps/v1
kind: Deployment
metadata:
  name: client-reviews-service
  namespace: dealer
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      app: client-reviews-service
  template:
    metadata:
      labels:
        app: client-reviews-service
    spec:
      containers:
        - name: client-reviews-service
          image: __IMG_CLIENT_REVIEWS__
          imagePullPolicy: __PULL_POLICY__
          ports:
            - containerPort: 50060
            - containerPort: 8089
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8089
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8089
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          env:
            - name: CLIENT_REVIEWS_GRPC_PORT
              value: "50060"
            - name: CLIENT_REVIEWS_HTTP_PORT
              value: "8089"
            - name: POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: dealer-db
                  key: POSTGRES_DSN
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: dealer-app-secrets
                  key: JWT_SECRET
            - name: VEHICLES_GRPC_ADDR
              value: "vehicles-service:50053"
            - name: KAFKA_BROKERS
              value: "kafka:29092"
            - name: KAFKA_TOPIC_ERRORS
              value: "platform.errors.v1"
            - name: KAFKA_TOPIC_REVIEW_PUBLISHED
              value: "review.published.v1"
