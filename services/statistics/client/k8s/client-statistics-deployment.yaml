apiVersion: apps/v1
kind: Deployment
metadata:
  name: client-statistics-service
  namespace: dealer
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      app: client-statistics-service
  template:
    metadata:
      labels:
        app: client-statistics-service
    spec:
      containers:
        - name: client-statistics-service
          image: __IMG_CLIENT_STATISTICS__
          imagePullPolicy: __PULL_POLICY__
          ports:
            - containerPort: 50062
            - containerPort: 8095
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8095
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8095
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          env:
            - name: CLIENT_STATISTICS_GRPC_PORT
              value: "50062"
            - name: CLIENT_STATISTICS_HTTP_PORT
              value: "8095"
            - name: POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: dealer-db
                  key: POSTGRES_DSN
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: dealer-app-secrets
                  key: JWT_SECRET
            - name: KAFKA_BROKERS
              value: "kafka:29092"
            - name: KAFKA_TOPIC_ERRORS
              value: "platform.errors.v1"
            - name: KAFKA_TOPIC_REVIEW_PUBLISHED
              value: "review.published.v1"
            - name: KAFKA_TOPIC_CLIENT_REGISTRATION
              value: "client.registration.v1"
            - name: KAFKA_CONSUMER_GROUP_CLIENT_STATISTICS
              value: "client-statistics"
